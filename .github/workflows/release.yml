name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v)"
        required: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux: AppImage + .deb
  # ---------------------------------------------------------------------------
  linux:
    name: Build Linux (AppImage + .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Build AppImage
        run: ./packaging/linux/build-appimage.sh x64
        env:
          NOOR_VERSION: ${{ steps.ver.outputs.version }}

      - name: Build .deb
        run: ./packaging/linux/build-deb.sh x64
        env:
          NOOR_VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Noor-AppImage-x64
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Noor-deb-x64
          path: dist/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: Inno Setup installer
  # ---------------------------------------------------------------------------
  windows:
    name: Build Windows (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $ref = "$env:GITHUB_REF_NAME"
            $v = $ref.TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "1.0.0" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        shell: pwsh
        run: pwsh packaging/windows/build-installer.ps1
        env:
          NOOR_VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Windows-installer
          path: dist/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) -exec cp {} release/ \;
          ls -lh release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Noor ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
