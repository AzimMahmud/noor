<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 300">
  <defs>
    <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="50%" style="stop-color:#159895"/>
      <stop offset="100%" style="stop-color:#57C5B6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="624" height="300" rx="20" fill="url(#splashGrad)"/>
  <!-- Subtle geometric pattern overlay -->
  <g opacity="0.08" fill="white">
    <circle cx="100" cy="80" r="120"/>
    <circle cx="524" cy="220" r="100"/>
    <circle cx="312" cy="50" r="60"/>
  </g>
  <!-- Mosque silhouette - centered left -->
  <g transform="translate(180, 80) scale(1.4)" fill="white" opacity="0.2">
    <path d="M50 10 C30 10 15 30 15 50 L15 85 L85 85 L85 50 C85 30 70 10 50 10 Z"/>
    <rect x="8" y="30" width="6" height="55" rx="1"/>
    <circle cx="11" cy="28" r="4"/>
    <rect x="86" y="30" width="6" height="55" rx="1"/>
    <circle cx="89" cy="28" r="4"/>
  </g>
  <!-- App name -->
  <text x="312" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="600" fill="white" text-anchor="middle" opacity="0.95">Salat Reminder</text>
  <!-- Subtitle -->
  <text x="312" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.7">Islamic Prayer Times</text>
  <!-- Decorative line -->
  <line x1="250" y1="195" x2="374" y2="195" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Arabic text -->
  <text x="312" y="230" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.6" direction="rtl">&#x635;&#x644;&#x627;&#x629;</text>
</svg>
